<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b232f" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>

    <!-- Component Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2aa4f4" />
      <stop offset="100%" stop-color="#0c72c4" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3bf475" />
      <stop offset="100%" stop-color="#0fa33b" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2aa4f4" />
      <stop offset="100%" stop-color="#3bf475" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>

    <!-- Soft Glow Filters (applied to separate glow layers under the sharp graphics) -->
    <filter id="blurBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="blurGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <!-- Clip Path for Background Squircle -->
    <clipPath id="bgClip">
      <rect x="16" y="16" width="480" height="480" rx="108" />
    </clipPath>
  </defs>

  <!-- Background Squircle with Diagonal Gloss -->
  <g clip-path="url(#bgClip)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
    <!-- Diagonal split shade -->
    <path d="M -50,550 L 550,-50 L 550,550 Z" fill="#000000" opacity="0.16" />
  </g>

  <!-- GLOW LAYERS (Underneath) -->
  
  <!-- Rays glow -->
  <g stroke="#32c5ff" stroke-width="8" stroke-linecap="round" filter="url(#blurBlue)" opacity="0.65">
    <line x1="245" y1="125" x2="265" y2="115" />
    <line x1="245" y1="150" x2="265" y2="160" />
    <line x1="138" y1="252" x2="126" y2="272" />
    <line x1="192" y1="252" x2="204" y2="272" />
  </g>

  <!-- LAN Port glow -->
  <rect x="100" y="100" width="130" height="130" rx="26" fill="#2aa4f4" filter="url(#blurBlue)" opacity="0.5" />

  <!-- House & Waves glow -->
  <g transform="translate(295, 270)">
    <path d="M 70,-5 L 138,52 L 120,52 L 120,123 A 12,12 0 0,1 108,135 L 85,135 L 85,97 A 15,15 0 0,0 70,82 A 15,15 0 0,0 55,97 L 55,135 L 32,135 A 12,12 0 0,1 20,123 L 20,52 L 2,52 Z" fill="#3cf07a" filter="url(#blurGreen)" opacity="0.5" />
    <path d="M 120,25 A 55,55 0 0,1 150,68" fill="none" stroke="#3bf475" stroke-width="8" stroke-linecap="round" filter="url(#blurGreen)" opacity="0.65" />
    <path d="M 130,5 A 80,80 0 0,1 172,68" fill="none" stroke="#3bf475" stroke-width="8" stroke-linecap="round" filter="url(#blurGreen)" opacity="0.65" />
  </g>

  <!-- Curved Arrow glow -->
  <path d="M 165,230 L 165,327 A 35,35 0 0,0 200,362 L 275,362" fill="none" stroke="url(#arrowGrad)" stroke-width="20" stroke-linecap="butt" filter="url(#blurGreen)" opacity="0.5" />
  <g transform="translate(284, 362)">
    <polygon points="-24,-18 10,0 -24,18" fill="#3cf07a" filter="url(#blurGreen)" opacity="0.6" />
  </g>

  <!-- Diagonal Arrow glow -->
  <path d="M 195,330 L 290,235" fill="none" stroke="#2aa4f4" stroke-width="20" stroke-linecap="butt" filter="url(#blurBlue)" opacity="0.5" />
  <g transform="translate(296, 229) rotate(-45)">
    <polygon points="-24,-18 10,0 -24,18" fill="#2aa4f4" filter="url(#blurBlue)" opacity="0.6" />
  </g>


  <!-- SHARP LAYERS (On Top) -->

  <!-- Rays sharp -->
  <g stroke="#32c5ff" stroke-width="8" stroke-linecap="round">
    <line x1="245" y1="125" x2="265" y2="115" />
    <line x1="245" y1="150" x2="265" y2="160" />
    <line x1="138" y1="252" x2="126" y2="272" />
    <line x1="192" y1="252" x2="204" y2="272" />
  </g>

  <!-- LAN Port sharp -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="130" height="130" rx="26" fill="url(#blueGrad)" stroke="#55d5ff" stroke-width="3" />
    
    <!-- Cutout inside (RJ45 socket) -->
    <path d="M 29,38 
             L 101,38 
             L 101,70 
             L 89,70 
             L 89,88 
             L 80,88 
             L 80,102 
             L 50,102 
             L 50,88 
             L 41,88 
             L 41,70 
             L 29,70 Z" 
          fill="#10141b" />

    <!-- Gold Pins inside the cutout -->
    <rect x="41" y="38" width="6" height="16" rx="1.5" fill="url(#goldGrad)" />
    <rect x="55" y="38" width="6" height="16" rx="1.5" fill="url(#goldGrad)" />
    <rect x="69" y="38" width="6" height="16" rx="1.5" fill="url(#goldGrad)" />
    <rect x="83" y="38" width="6" height="16" rx="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Smart House sharp -->
  <g transform="translate(295, 270)">
    <path d="M 70,-5 
             L 138,52 
             L 120,52 
             L 120,123 
             A 12,12 0 0,1 108,135 
             L 85,135 
             L 85,97 
             A 15,15 0 0,0 70,82 
             A 15,15 0 0,0 55,97 
             L 55,135 
             L 32,135 
             A 12,12 0 0,1 20,123 
             L 20,52 
             L 2,52 Z" 
          fill="url(#greenGrad)" stroke="#62ff9a" stroke-width="3" />

    <!-- WiFi/Smart waves -->
    <path d="M 120,25 A 55,55 0 0,1 150,68" fill="none" stroke="#3bf475" stroke-width="8" stroke-linecap="round" />
    <path d="M 130,5 A 80,80 0 0,1 172,68" fill="none" stroke="#3bf475" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Curved Arrow sharp -->
  <path d="M 165,230 L 165,327 A 35,35 0 0,0 200,362 L 275,362" fill="none" stroke="url(#arrowGrad)" stroke-width="20" stroke-linecap="butt" />
  <g transform="translate(284, 362)">
    <polygon points="-24,-18 10,0 -24,18" fill="#3cf07a" stroke="#62ff9a" stroke-width="2.5" />
  </g>

  <!-- Diagonal Arrow sharp -->
  <path d="M 195,330 L 290,235" fill="none" stroke="#2aa4f4" stroke-width="20" stroke-linecap="butt" />
  <g transform="translate(296, 229) rotate(-45)">
    <polygon points="-24,-18 10,0 -24,18" fill="#2aa4f4" stroke="#55d5ff" stroke-width="2.5" />
  </g>

</svg>
