    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.3.4.3.0"
    name: "Firmware Version"
    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  # Device Measurements
  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.3.1.2.1"
    name: "Total Current"
    type: gauge
    unit: "A"
    scale: 1.0
    ha_component: sensor
    device_class: current
    state_class: measurement
    poll_group: frequent

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.3.1.3.1"
    name: "Voltage"
    type: gauge
    unit: "V"
    scale: 1.0
    ha_component: sensor
    device_class: voltage
    state_class: measurement
    poll_group: frequent

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.3.1.4.1"
    name: "Active Power"
    type: gauge
    unit: "W"
    scale: 1.0
    ha_component: sensor
    device_class: power
    state_class: measurement
    poll_group: frequent

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.3.1.5.1"
    name: "Power Dissipation"
    type: gauge
    unit: "W"
    scale: 1.0
    ha_component: sensor
    device_class: power
    state_class: measurement
