# ATEN PE8108G eco PDU profile
# Tested against PE8108G firmware 2.5.248 with SNMP v2c.

id: aten-pdu-pe8108g
name: ATEN PE8108G eco PDU
manufacturer: ATEN
model: PE8108G
category: pdu
sys_object_id: ".1.3.6.1.4.1.21317"
snmp_versions:
  - v1
  - v2c

poll_groups:
  frequent: 1
  static: 10

oid_mappings:
  # System Information
  - oid: ".1.3.6.1.2.1.1.2.0"
    name: "System Object ID"
    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  - oid: ".1.3.6.1.2.1.1.5.0"
    name: "System Name"
    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  # PDU Identity
  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.1.0"
    name: "Model Name"
    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.2.0"
    name: "PDU Name"
    type: string
    ha_component: sensor
    category: diagnostic
    poll_group: static

  - oid: ".1.3.6.1.4.1.21317.1.3.2.2.2.1.21.0"
