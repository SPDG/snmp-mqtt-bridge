    name: "Outlet 1 State"
    type: enum
    ha_component: switch
    writable: true
    icon: "mdi:power-socket"
    enum_values:
      1: "Off"
      2: "On"
      3: "Pending"
      4: "Reboot"
      5: "Fault"
      6: "No Authorization"
      7: "Not Supported"
      8: "POP"
    poll_group: frequent

